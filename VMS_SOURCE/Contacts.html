<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Contact Us</title>
    <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon" />
    <link href="includes/style.css?v=@DateTime.Now.ToString()" rel="stylesheet" type="text/css" />

<body class="newUIBody">
    <form>
        <div class="contactPageWrap">
            <div class="card contactPageCard">
                <div class="breadcrumbs contactPageBar">
                    <div class="leftFung">
                        <div class="pageTitleWrap">
                            <h3 class="pageTitle">Contact Us</h3>
                            <p class="pageSubTitle">Reach the support team for assistance</p>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="contactPageInner">
                        <div class="contactLogoCol">
                            <img alt="" src="images/Contact_us_logo.png" class="contactPageLogo" />
                        </div>
                        <div class="contactSupportCol">
                            <div class="contactSupportHead">
                                <span>For Software Support</span>
                            </div>
                            <div class="contactEmailGrid">
                                <div class="contactEmailItem">
                                    <img alt="" src="images/email_us.jpg" />
                                    <span>hodistribution@bergerindia.com</span>
                                </div>
                                <div class="contactEmailItem">
                                    <img alt="" src="images/email_us.jpg" />
                                    <span>hodistribution2@bergerindia.com</span>
                                </div>
                                <div class="contactEmailItem">
                                    <img alt="" src="images/email_us.jpg" />
                                    <span>hodistribution3@bergerindia.com</span>
                                </div>
                                <div class="contactEmailItem">
                                    <img alt="" src="images/email_us.jpg" />
                                    <span>anishbasu@bergerindia.com</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</body>
</html>
